# OpenSearch for full-text search: docker compose up -d --wait, which returns once OpenSearch answers.
# The stand: docker compose --profile app up -d --build puts the jar built by Gradle into an image and runs it next
# to OpenSearch, see README, Stand
name: docai

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 2s
      timeout: 3s
      retries: 60

  # the application keeps no volume: with the stand profile it builds a template of each demo set for the day of its
  # start in the container, gives every visitor a copy of one and deletes a copy left idle; a new container builds the
  # templates anew, a restart reuses them, and OpenSearch keeps their indexes in its volume
  app:
    profiles: [app]
    container_name: jmix-docai
    image: jmix-docai
    build: .
    # the JVM exits when it runs out of memory, see Dockerfile, and the container starts again
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    # the stand profile unless DOCAI_ACTIVE_PROFILE names another; DOCAI_DEMO_DATA serves another profile, since the
    # stand gives every visitor a copy of the set of the login form
    environment:
      - DOCAI_SEARCH_URL=http://opensearch:9200
      - DOCAI_ACTIVE_PROFILE=${DOCAI_ACTIVE_PROFILE:-stand}
      - DOCAI_DEMO_DATA
      - DOCAI_AI_ENABLED
      - OPENAI_API_KEY
    ports:
      - "8080:8080"

volumes:
  opensearch-data:
