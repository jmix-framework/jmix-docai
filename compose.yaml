# OpenSearch for full-text search: docker compose up -d --wait, which returns once OpenSearch answers.
# The stand: docker compose --profile app up -d --build puts the jar built by Gradle into an image and runs it next
# to OpenSearch, see README, Stand
name: docai

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 2s
      timeout: 3s
      retries: 60

  app:
    profiles: [app]
    container_name: jmix-docai
    image: jmix-docai
    build: .
    depends_on:
      opensearch:
        condition: service_healthy
    # the pipeline sets the profile, the demo set and the key of the stand
    environment:
      - DOCAI_SEARCH_URL=http://opensearch:9200
      - DOCAI_ACTIVE_PROFILE
      - DOCAI_DEMO_DATA
      - DOCAI_AI_ENABLED
      - OPENAI_API_KEY
    ports:
      - "8080:8080"
    # the database and the files of the application, under its working directory
    volumes:
      - docai-data:/.jmix

volumes:
  opensearch-data:
  docai-data:
