plugins {
    id 'io.jmix' version '3.1.0'
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '3.1.0'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
    maven {
        url = 'https://nexus.jmix.io/repository/public'
    }
    maven {
        url = 'https://nexus.jmix.io/repository/premium'
        credentials {
            username = rootProject['premiumRepoUser']
            password = rootProject['premiumRepoPass']
        }
    }
}

dependencies {
    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'io.jmix.datatools:jmix-datatools-starter'
    implementation 'io.jmix.datatools:jmix-datatools-flowui-starter'
    implementation 'io.jmix.dynattr:jmix-dynattr-starter'
    implementation 'io.jmix.dynattr:jmix-dynattr-flowui-starter'
    implementation 'io.jmix.search:jmix-search-starter'
    implementation 'io.jmix.search:jmix-search-opensearch-starter'
    implementation 'io.jmix.quartz:jmix-quartz-starter'
    implementation 'io.jmix.aichat:jmix-aichat-flowui-starter'
    implementation 'io.jmix.translations:jmix-translations-ru'
    implementation 'org.apache.tika:tika-core'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.vaadin:vaadin-dev'

    runtimeOnly 'org.hsqldb:hsqldb'
    runtimeOnly 'org.apache.tika:tika-parsers-standard-package'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

test {
    useJUnitPlatform {
        excludeTags 'search', 'ai'
    }
    systemProperty 'spring.profiles.active', 'test'
    // a key in the environment (SPRING_AI_OPENAI_APIKEY) outranks the property files, so the tests clear it here
    systemProperty 'spring.ai.openai.api-key', ''
}

tasks.register('searchTest', Test) {
    description = 'Runs the full-text search tests against OpenSearch from compose.yaml.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'search'
    }

    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'jmix.search.enabled', 'true'
    systemProperty 'jmix.search.search-index-name-prefix', 'dms_test_'
    systemProperty 'jmix.search.server.bulk-request-refresh-policy', 'WAIT_FOR'
    systemProperty 'spring.ai.openai.api-key', ''
}

tasks.register('aiTest', Test) {
    description = 'Runs the AI tests against the OpenAI model with the key from OPENAI_API_KEY.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ai'
    }

    systemProperty 'spring.profiles.active', 'test'
    // Spring resolves the placeholder from the environment, so the key never appears on the command line
    systemProperty 'spring.ai.openai.api-key', '${OPENAI_API_KEY:}'
}

idea {
    module {
        excludeDirs.addAll(files '.jmix', 'node_modules', 'src/main/frontend/generated/', 'src/main/bundles', 'target',
                '.claude', '.agents', '.skills', '.superpowers', 'docs/superpowers')
    }
}

vaadin {
    optimizeBundle = false
    productionMode = false
}
