main.datasource.url=jdbc:hsqldb:mem:dms
main.datasource.username=sa
main.datasource.password=

jmix.localfs.storage-dir=build/test-filestorage

# the search tests turn search on, see the searchTest task
jmix.search.enabled=false
# no test touches the indexes of the application, even with search on
jmix.search.search-index-name-prefix=dms_test_
spring.quartz.auto-startup=false

# the AI features stay off unless a test gives a key, see the aiTest task
spring.ai.openai.api-key=
