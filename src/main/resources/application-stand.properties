# a public stand: smaller limits, so a visitor takes less disk and fewer tokens; an answer that hangs gives up sooner
docai.files.max-file-size=5MB
jmix.aitools.ui.data.chat-memory-max-messages=10
jmix.aitools.dataload.jpql-execution-max-result-limit=50
jmix.aitools.ui.assistant-response-timeout=2m

# the login form opens with alice, the office manager of the demo sets, filled in
ui.login.defaultUsername=alice
ui.login.defaultPassword=alice

# a zip bomb or a broken PDF a visitor uploads stops at these limits of reading its text: a longer text gives the
# full-text search nothing and the AI its beginning, a longer parse gives no text at all; a demo set has texts of a few
# thousand characters
docai.files.max-text-length=1000000
docai.files.text-timeout=10s

# development logs every check of rights
logging.level.io.jmix.core.AccessLogger=info

# any visitor can sign in as the admin, and a Groovy script kept in a copy would run in the one JVM of every copy
jmix.core.unsafe-runtime-features-enabled=false
jmix.dynattr.ui.groovy-enabled=false
jmix.security.data.groovy-enabled=false
# a row-level predicate that is a script denies every row, and Jmix would log a warning for each row it checks
logging.level.io.jmix.securitydata.impl.role.provider.SecurityDataGroovyFeatureSupport=error

# behind a proxy that ends TLS, X-Forwarded-Proto makes the request secure, so the cookies of a visitor keep Secure
server.forward-headers-strategy=native

# the data source of the stand sends each thread to a database of its own: the control one, a template or a copy
jmix.data.dbms-type=hsql
# each copy opens a pool of connections and closes it with the copy, which is no news for the log
logging.level.com.zaxxer.hikari=warn

# the add-on's jobs read only the control database; the stand processes each copy's queue, see StandIndexes
jmix.search.use-default-indexing-queue-processing-quartz-configuration=false
jmix.search.use-default-enqueueing-session-processing-quartz-configuration=false
# a database job store would go through the stand's data source, which sends a request's job to its copy
spring.quartz.job-store-type=memory

# the copies of the demo data, see StandProperties; jmix.localfs.storage-dir is not used on the stand
docai.stand.copy-idle-timeout=30m
docai.stand.copy-upload-quota=20MB
docai.stand.template-languages=en,ru
docai.stand.upload-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,\
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv,image/png,image/jpeg
docai.stand.min-free-disk=1GB
docai.stand.data-dir=.jmix/stand
# a template that fails is tried again after this pause, twice as long each time, up to the longest
docai.stand.template-retry-pause=1m
docai.stand.template-retry-pause-max=10m
