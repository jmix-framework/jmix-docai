# the stand of compose.yaml, see README: an empty login form and the demo set of the webinar
docai.demo-data=${DOCAI_DEMO_DATA:en}

# a public stand: smaller files, a shorter memory of a chat and fewer rows per query of the assistant, so a visitor
# takes less disk and fewer tokens; an answer that hangs gives up sooner
docai.files.max-file-size=5MB
jmix.aitools.ui.data.chat-memory-max-messages=10
jmix.aitools.dataload.jpql-execution-max-result-limit=50
jmix.aitools.ui.assistant-response-timeout=2m

# development logs every check of rights
logging.level.io.jmix.core.AccessLogger=info
