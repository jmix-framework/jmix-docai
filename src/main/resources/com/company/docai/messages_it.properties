com.company.docai.view.usagehelp/usageHelpView.title=Scenari d'uso
com.company.docai.view.usagehelp/usageHelpView.content=<div class="usage-help-content">\
  <p>Accedi con uno di questi utenti (nome utente / password):</p>\
  <ul>\
  <li><b>admin</b> / admin: amministratore, vede tutte le cartelle ed elimina definitivamente dal cestino</li>\
  <li><b>alice</b> / alice: Alice Moretti, office manager, smista i documenti in arrivo</li>\
  <li><b>peter</b> / peter: Pietro Galli, dipendente con un accesso limitato</li>\
  <li><b>helen</b> / helen: Elena Conti, responsabile del personale, l'unica dipendente che vede il contratto di ricerca e selezione del personale</li>\
  <li><b>maria</b> / maria: Maria Lombardi, controller in amministrazione</li>\
  <li><b>john</b> / john: Giovanni Ricci, avvocato dell'ufficio legale</li>\
  </ul>\
  <p>Cosa provare:</p>\
  <ul>\
  <li><b>Ricerca IA.</b> Attiva la bacchetta nel campo di ricerca, digita <i>macchine agricole</i> e premi Invio: trovi 12 documenti, anche se nessuno di essi contiene queste parole. La ricerca per parole non trova nulla e Pietro ne vede 9, perché l'archivio gli è precluso.</li>\
  <li><b>Ricerca nei file.</b> La parola <i>derattizzazione</i> compare solo all'interno del PDF del contratto di servizi n.&nbsp;7, e la ricerca la trova.</li>\
  <li><b>Compila con IA.</b> Apri una scansione nella cartella «In arrivo» e fai clic su Compila con IA: l'IA legge il file e compila il tipo, i campi, la data e i tag.</li>\
  <li><b>Scheda del documento.</b> Apri «Contratto di locazione n.&nbsp;112» nella cartella «Contratti»: ha tre versioni e alcuni commenti sulla penale. Nella scheda Assistente IA chiedi che cosa è stato concordato.</li>\
  <li><b>Assistente IA.</b> Scegli Assistente IA nel menu e chiedi quali fatture scadono questo mese.</li>\
  <li><b>Accesso.</b> Fai clic su Accesso per una cartella o un documento per vedere chi può visualizzarlo, modificarlo o gestirlo.</li>\
  <li><b>Preferiti.</b> Contrassegna con la stella le cartelle e i documenti che usi spesso, oppure trascinali nei Preferiti.</li>\
  <li><b>Cestino.</b> La cartella «Bozze» e la prima bozza del contratto di locazione n.&nbsp;112 sono nel cestino: ripristinale oppure eliminale definitivamente come admin.</li>\
  </ul>\
  </div>
com.company.docai.view.usagehelp/privateNote.text=Le tue modifiche sono private: gli altri non vedono ciò che carichi, modifichi o elimini

