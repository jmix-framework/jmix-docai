io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.tooltipMessage = <div>Espressione JPQL che viene aggiunta \
  alla clausola "from" della query del data loader.<br/> \
  Può servire per creare una condizione basata su un attributo di una collezione collegata.<br><br> \
  L'espressione deve iniziare con una virgola, "join" o "left join".<br/>\
  Usa il segnaposto {E} al posto dell'alias dell'entità.<br><br>\
  Per esempio:<br/>\
  <code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.helperText=<div> L'espressione deve iniziare con \
  una virgola, "join" o "left join". Per esempio: </span><code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.requiredMessage = Compila il campo "Where"
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.tooltipMessage = <div>Espressione JPQL che viene aggiunta \
  alla clausola "where" della query del data loader. \
  Usa il segnaposto {E} al posto dell'alias dell'entità.<br><br>\
  La condizione può avere al massimo un parametro, indicato con <b>?</b>.<br/>\
  Si possono usare anche i seguenti parametri predefiniti:<ul>\
  <li><code>:current_user_&lt;attribute&gt;</code> – un attributo dell'utente corrente.</li>\
  <li><code>:session_&lt;attribute&gt;</code> – un attributo della sessione.</li></ul>\
  Se l'espressione usa la clausola <code>like</code>, il valore viene racchiuso automaticamente in <code>(?i)%value%</code> \
  per una ricerca che non distingue tra maiuscole e minuscole.<br/>\
  <br/>\
  Esempio di selezione delle entità in base a un attributo della collezione <code>tags</code> collegata con join:<br/>\
  <code>t.name like ?</code></div>
