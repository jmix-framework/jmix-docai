com.company.docai.view.tour/greeting.text=Ciao, sono Doc! Ti mostro come DocAI ti aiuta in una normale giornata di lavoro.
com.company.docai.view.tour/home.text=Questa è la tua pagina iniziale: scadenze imminenti, documenti senza tipo e modifiche recenti.
com.company.docai.view.tour/scanCard.text=Questa è la scheda di un documento: i suoi campi, le versioni, i commenti e l'anteprima del file. Questa scansione è arrivata senza tipo e senza campi.
com.company.docai.view.tour/uploadedCard.text=Questa è la scheda del documento che hai caricato: i suoi campi, le versioni, i commenti e l'anteprima del file. Non ha ancora né tipo né campi.
com.company.docai.view.tour/fillWithAi.text=Fai clic su Compila con IA: l'IA legge il file e compila il tipo, i campi, la data e i tag. I campi compilati sono contrassegnati da una bacchetta: controllali e salva.
com.company.docai.view.tour/searchByMeaning.text=Attiva la bacchetta, digita "macchine agricole" o qualsiasi cosa con parole tue e premi Invio. La ricerca IA trova i documenti per significato, anche se non contengono queste parole.
com.company.docai.view.tour/searchByMeaning.fieldText=Digita "macchine agricole" o qualsiasi cosa con parole tue e premi Invio. La ricerca IA trova i documenti per significato, anche se non contengono queste parole.
com.company.docai.view.tour/leaseCard.text=Questo contratto di locazione ha tre versioni e i commenti mostrano come è stata negoziata la penale.
com.company.docai.view.tour/leaseAssistant.text=Apri la scheda Assistente IA di questo documento e chiedi che cosa è stato concordato. L'IA risponde in base a questo documento.
com.company.docai.view.tour/assistantMenu.text=Assistente IA nel menu è una chat su tutti i tuoi documenti: aprila.
com.company.docai.view.tour/assistantQuestion.text=Chiedi quali fatture scadono questo mese.
com.company.docai.view.tour/repository.text=Questo è l'archivio documentale: a sinistra l'albero delle cartelle, nella tabella i documenti della cartella. Anteprima mostra a destra il file selezionato.
com.company.docai.view.tour/upload.text=Trascina questa fattura nella tabella o fai clic su Caricala: diventerà un documento di questa cartella.
com.company.docai.view.tour/finale.text=Hai visto le funzioni principali, ma c'è dell'altro: l'accesso alle cartelle, i preferiti, il cestino e la discussione di più documenti con l'IA. Puoi rifare il tour dal menu utente.
com.company.docai.view.tour/finale.noAiText=Hai visto le funzioni principali, ma c'è dell'altro: l'accesso alle cartelle, i preferiti e il cestino. Puoi rifare il tour dal menu utente.
