io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScript=Script Groovy di caricamento delle opzioni
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScriptHelp=<div>Consente di caricare le opzioni dell'attributo dinamico con uno script Groovy.\
  <br/>Lo script deve restituire l'elenco delle opzioni. L'entità con gli attributi dinamici è disponibile \
  nello script tramite la variabile <code>entity</code>. Nota che la variabile <code>entity</code> può essere <code>null</code> se lo script \
  è usato in un filtro con un elenco a discesa.\
  <br/>\
  <br/>Per esempio:\
  <br/><code>return ['code_1', 'code_2', (entity ? entity.code : 'code_0')]</code></div>
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScript=Script SQL di caricamento delle opzioni
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScriptHelp=<div>Consente di caricare le opzioni dell'attributo dinamico con uno script SQL.\
  <br/>Lo script deve restituire l'elenco delle opzioni.\
  <br/>I valori degli attributi dinamici sono disponibili nello script tramite la variabile <code>entity</code>. Nota che la variabile <code>entity</code> \
  non è definita in un filtro con un elenco a discesa.\
  <br/>\
  <br/>Per esempio:\
  <br/><code>select street from db_Address e where e.strName = ${entity.+&lt;dynamicAttrCode&gt;}</code>\
  <br/>dove &lt;dynamicAttrCode&gt; è il codice dell'attributo dinamico corrispondente</div>
io.jmix.dynattrflowui.view.categoryattr/joinClause=Clausola Join
io.jmix.dynattrflowui.view.categoryattr/joinClauseHelp=<div>Il valore di questo campo viene aggiunto alla clausola "from" della query. Deve iniziare con una virgola, "join" o "left join".\
  <br/>I valori degli attributi dinamici sono disponibili nello script tramite la variabile <code>entity</code>:\
  <br/>${entity.+&lt;dynamicAttrCode&gt;}, dove &lt;dynamicAttrCode&gt; è il codice dell'attributo dinamico corrispondente. \
  <br/>Nota che la variabile <code>entity</code> non è definita in un filtro con un elenco a discesa.\
  <br/>Usa il segnaposto {E} come alias dell'entità estratta. All'esecuzione della query viene sostituito con l'alias reale indicato nella query.\
  <br/>\
  <br/>Per esempio:\
  <br/><code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/joinHelperText=<div>Il valore di questo campo viene aggiunto alla clausola "from" della query. \
  Deve iniziare con una virgola, "join" o "left join". Per esempio: <code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/whereClause=Clausola Where
io.jmix.dynattrflowui.view.categoryattr/whereClauseHelp=<div>Il valore di questo campo viene aggiunto alla clausola "where" della query con la condizione "and". La parola "where" non serve: viene aggiunta automaticamente.\
  <br/>Usa il segnaposto {E} come alias dell'entità estratta. All'esecuzione della query viene sostituito con l'alias reale indicato nella query.\
  <br/>I valori degli attributi dinamici sono disponibili nello script tramite la variabile <code>entity</code>. Nota che la variabile <code>entity</code> \
  non è definita in un filtro con un elenco a discesa.\
  <br/>\
  <br/>Per esempio:\
  <br/><code>{E}.salary > ${entity.+&lt;dynamicAttrCode&gt;} and {E}.department = 'abc'</code>\
  <br/>dove &lt;dynamicAttrCode&gt; è il codice dell'attributo dinamico corrispondente</div>
io.jmix.dynattrflowui.view.categoryattr/validationScript=Validazione personalizzata
io.jmix.dynattrflowui.view.categoryattr/validationScriptHelp=<div>Consente di applicare uno script Groovy al valore prima di salvarlo.\
  <br/>Se la validazione non riesce, lo script deve restituire il messaggio di errore. Altrimenti \
  lo script non deve restituire alcun valore oppure deve restituire <code>null</code>. \
  <br/>Il valore è disponibile nello script tramite la variabile <code>value</code>. \
  Il messaggio di errore è una stringa modello \
  in cui puoi usare la chiave '${value}' per inserire il valore.\
  <br/>\
  <br/>Per esempio:\
  <br/><code>if (!value.startsWith("correctValue")) return "the value '\\${value}' is incorrect"</code></div>
io.jmix.dynattrflowui.view.categoryattr/recalculationScript=Script di ricalcolo
io.jmix.dynattrflowui.view.categoryattr/recalculationScriptHelp=<div>Script Groovy usato per ricalcolare il valore di questo campo.\
  <br/> Allo script vengono passate le seguenti variabili: \
  <br/>\
  <br/><code>entity</code> - l'entità in modifica \
  <br/>\
  <br/><code>dynamicAttributes</code> - una mappa in cui la chiave è il codice dell'attributo e il valore è il valore dell'attributo dinamico \
  <br/>\
  <br/>Esempio di script di ricalcolo che usa la mappa dynamicAttributes: \
  <br/>\
  <br/><code>if (dynamicAttributes['PassengerNumberOfSeats'] > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>Esempio di script di ricalcolo che usa la classe EntityValues: \
  <br/>\
  <br/><code>import io.jmix.core.entity.EntityValues;\
  <br/>\
  <br/>if(EntityValues.getValue(entity,"+PassengerNumberofseats") > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>Lo script viene eseguito ogni volta che cambia il valore di uno dei campi dell'elenco "Dipende dai campi".</div>
io.jmix.dynattrflowui.view.categoryattr/entityViewAccessDeniedMessage=Accesso negato alla vista dell'entità. Aggiungi i permessi per aprire la vista.
