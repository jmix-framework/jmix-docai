com.company.docai.view.usagehelp/usageHelpView.title=Anwendungsszenarien
com.company.docai.view.usagehelp/usageHelpView.content=<div class="usage-help-content">\
  <p>Melden Sie sich als einer dieser Benutzer an (Benutzername / Passwort):</p>\
  <ul>\
  <li><b>admin</b> / admin: Administrator, sieht alle Ordner und löscht endgültig aus dem Papierkorb</li>\
  <li><b>alice</b> / alice: Alina Hoffmann, Office-Managerin, legt die eingehenden Dokumente ab</li>\
  <li><b>peter</b> / peter: Peter Wagner, Mitarbeiter mit eingeschränktem Zugriff</li>\
  <li><b>helen</b> / helen: Helene Vogel, Personalreferentin, sieht als einzige Mitarbeiterin den Personalvermittlungsvertrag</li>\
  <li><b>maria</b> / maria: Maria Lehmann, Controllerin in der Buchhaltung</li>\
  <li><b>john</b> / john: Johannes Müller, Jurist in der Rechtsabteilung</li>\
  </ul>\
  <p>Was Sie ausprobieren können:</p>\
  <ul>\
  <li><b>KI-Suche.</b> Schalten Sie im Suchfeld den Zauberstab ein, geben Sie <i>Landtechnik</i> ein und drücken Sie Enter: Sie erhalten 12 Dokumente, obwohl keines dieses Wort enthält. Die Suche nach Wörtern findet nichts, und Peter erhält 9, da das Archiv für ihn gesperrt ist.</li>\
  <li><b>Suche in Dateien.</b> Das Wort <i>Begasung</i> steht nur im PDF des Dienstleistungsvertrags Nr.&nbsp;7, und die Suche findet es.</li>\
  <li><b>Mit KI ausfüllen.</b> Öffnen Sie einen Scan im Posteingang und klicken Sie auf „Mit KI ausfüllen“: Die KI liest die Datei und füllt Typ, Felder, Datum und Tags aus.</li>\
  <li><b>Dokumentkarte.</b> Öffnen Sie den Mietvertrag Nr.&nbsp;112 im Ordner „Verträge“: Er hat drei Versionen und Kommentare zur Vertragsstrafe. Fragen Sie auf dem Reiter „KI-Assistent“, was vereinbart wurde.</li>\
  <li><b>KI-Assistent.</b> Wählen Sie im Menü „KI-Assistent“ und fragen Sie, welche Rechnungen in diesem Monat fällig sind.</li>\
  <li><b>Zugriff.</b> Klicken Sie bei einem Ordner oder Dokument auf „Zugriff“, um zu sehen, wer es anzeigen, bearbeiten oder verwalten darf.</li>\
  <li><b>Favoriten.</b> Markieren Sie häufig benötigte Ordner und Dokumente mit einem Stern oder ziehen Sie sie in die Favoriten.</li>\
  <li><b>Papierkorb.</b> Der Ordner „Entwürfe“ und der erste Entwurf des Mietvertrags Nr.&nbsp;112 liegen im Papierkorb: Stellen Sie sie wieder her oder löschen Sie sie als admin endgültig.</li>\
  </ul>\
  </div>
