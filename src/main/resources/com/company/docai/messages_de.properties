com.company.docai.view.tour/greeting.text=Hallo, ich bin Doc! Ich zeige Ihnen, wie DocAI an einem gewöhnlichen Arbeitstag hilft.
com.company.docai.view.tour/home.text=Das ist Ihre Startseite: anstehende Fristen, Dokumente ohne Typ und die letzten Änderungen.
com.company.docai.view.tour/scanCard.text=Das ist eine Dokumentkarte: Felder, Versionen, Kommentare und eine Vorschau der Datei. Dieser Scan kam ohne Typ und ohne Felder an.
com.company.docai.view.tour/uploadedCard.text=Das ist die Karte des Dokuments, das Sie hochgeladen haben: Felder, Versionen, Kommentare und eine Vorschau der Datei. Typ und Felder fehlen noch.
com.company.docai.view.tour/fillWithAi.text=Klicken Sie auf „Mit KI ausfüllen“: Die KI liest die Datei und füllt Typ, Felder, Datum und Tags aus. Ausgefüllte Felder sind mit einem Zauberstab markiert: Prüfen Sie sie und speichern Sie.
com.company.docai.view.tour/searchByMeaning.text=Schalten Sie den Zauberstab ein, geben Sie „Landtechnik“ oder etwas in eigenen Worten ein und drücken Sie Enter. Die KI-Suche findet Dokumente nach ihrer Bedeutung, auch wenn diese Wörter darin nicht vorkommen.
com.company.docai.view.tour/searchByMeaning.fieldText=Geben Sie „Landtechnik“ oder etwas in eigenen Worten ein und drücken Sie Enter. Die KI-Suche findet Dokumente nach ihrer Bedeutung, auch wenn diese Wörter darin nicht vorkommen.
com.company.docai.view.tour/leaseCard.text=Dieser Mietvertrag hat drei Versionen, und die Kommentare zeigen, wie die Vertragsstrafe verhandelt wurde.
com.company.docai.view.tour/leaseAssistant.text=Öffnen Sie in dieser Karte den Reiter „KI-Assistent“ und fragen Sie, was vereinbart wurde. Die KI antwortet anhand dieses Dokuments.
com.company.docai.view.tour/assistantMenu.text=Der KI-Assistent im Menü ist ein Chat über alle Ihre Dokumente: Öffnen Sie ihn.
com.company.docai.view.tour/assistantQuestion.text=Fragen Sie, welche Rechnungen in diesem Monat fällig sind.
com.company.docai.view.tour/repository.text=Das ist die Ablage: links der Ordnerbaum, in der Tabelle die Dokumente des Ordners. Die Vorschau zeigt rechts die ausgewählte Datei.
com.company.docai.view.tour/upload.text=Ziehen Sie diese Rechnung in die Tabelle oder klicken Sie auf „Hochladen“: Sie wird zu einem Dokument in diesem Ordner.
com.company.docai.view.tour/finale.text=Sie haben die wichtigsten Funktionen gesehen, und es gibt noch mehr: Zugriff auf Ordner, Favoriten, den Papierkorb und die Besprechung mehrerer Dokumente mit der KI. Die Tour können Sie im Benutzermenü wiederholen.
com.company.docai.view.tour/finale.noAiText=Sie haben die wichtigsten Funktionen gesehen, und es gibt noch mehr: Zugriff auf Ordner, Favoriten und den Papierkorb. Die Tour können Sie im Benutzermenü wiederholen.
