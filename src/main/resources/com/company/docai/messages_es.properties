com.company.docai.view.usagehelp/usageHelpView.title=Escenarios de uso
com.company.docai.view.usagehelp/usageHelpView.content=<div class="usage-help-content">\
  <p>Inicie sesión con uno de estos usuarios (nombre de usuario / contraseña):</p>\
  <ul>\
  <li><b>admin</b> / admin: administrador, ve todas las carpetas y elimina definitivamente de la papelera</li>\
  <li><b>alice</b> / alice: Alicia Moreno, responsable de oficina, archiva los documentos entrantes</li>\
  <li><b>peter</b> / peter: Pedro Navarro, empleado con acceso limitado</li>\
  <li><b>helen</b> / helen: Elena Castro, responsable de Recursos Humanos, la única empleada que ve el contrato con la agencia de selección</li>\
  <li><b>maria</b> / maria: María Romero, controller en Contabilidad</li>\
  <li><b>john</b> / john: Juan Ortega, abogado del Departamento Jurídico</li>\
  </ul>\
  <p>Qué probar:</p>\
  <ul>\
  <li><b>Búsqueda con IA.</b> Active la varita del campo de búsqueda, escriba <i>maquinaria agrícola</i> y pulse Intro: obtendrá 12 documentos, aunque ninguno contiene estas palabras. La búsqueda por palabras no encuentra nada, y Pedro obtiene 9, porque el archivo está cerrado para él.</li>\
  <li><b>Búsqueda dentro de los archivos.</b> La palabra <i>desratización</i> aparece solo dentro del PDF del contrato de servicios n.º&nbsp;7, y la búsqueda la encuentra.</li>\
  <li><b>Rellenar con IA.</b> Abra un escaneo de la Bandeja de entrada y haga clic en Rellenar con IA: la IA lee el archivo y rellena el tipo, los campos, la fecha y las etiquetas.</li>\
  <li><b>Ficha del documento.</b> Abra el Contrato de arrendamiento n.º&nbsp;112 en Contratos: tiene tres versiones y comentarios sobre la penalización. En la pestaña Asistente de IA, pregunte qué se acordó.</li>\
  <li><b>Asistente de IA.</b> Elija Asistente de IA en el menú y pregunte qué facturas vencen este mes.</li>\
  <li><b>Acceso.</b> Haga clic en Acceso en una carpeta o un documento para ver quién puede verlo, editarlo o gestionarlo.</li>\
  <li><b>Favoritos.</b> Marque con una estrella las carpetas y los documentos que usa a menudo, o arrástrelos a Favoritos.</li>\
  <li><b>Papelera.</b> La carpeta Borradores y el primer borrador del contrato de arrendamiento n.º&nbsp;112 están en la papelera: restáurelos o elimínelos definitivamente como admin.</li>\
  </ul>\
  </div>
