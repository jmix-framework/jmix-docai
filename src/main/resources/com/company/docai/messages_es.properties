io.jmix.flowui.app.propertyfilter.dateinterval.component/NextLastIntervalField.includingCurrentHelperBtn.messageDialog.content=<div>\
  <p>\
     La opción «incluido el actual» no desplaza el intervalo resultante. Por ejemplo, si el intervalo \
     seleccionado son los últimos dos días y no se usa la opción «incluido el actual» para la fecha <code>'04-MM-yyyy'</code>, \
     el intervalo resultante incluirá las siguientes fechas:\
  </p>\
  <ul>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Si el ejemplo anterior usa la opción «incluido el actual», el intervalo resultante incluye las siguientes \
     fechas:\
  </p>\
  <ul>\
     <li>04-MM-yyyy;</li>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     La misma regla se aplica al año, el mes, la hora y el minuto.\
  </p>\
</div>
