com.company.docai.view.tour/greeting.text=¡Hola, soy Doc! Le mostraré cómo le ayuda DocAI en un día de trabajo normal.
com.company.docai.view.tour/home.text=Esta es su página de inicio: próximos vencimientos, documentos sin tipo y cambios recientes.
com.company.docai.view.tour/scanCard.text=Esta es la ficha de un documento: sus campos, versiones, comentarios y una vista previa del archivo. Este escaneo ha llegado sin tipo ni campos.
com.company.docai.view.tour/uploadedCard.text=Esta es la ficha del documento que ha subido: sus campos, versiones, comentarios y una vista previa del archivo. Todavía no tiene tipo ni campos.
com.company.docai.view.tour/fillWithAi.text=Haga clic en Rellenar con IA: la IA lee el archivo y rellena el tipo, los campos, la fecha y las etiquetas. Los campos rellenados llevan una varita: revíselos y guarde.
com.company.docai.view.tour/searchByMeaning.text=Active la varita, escriba «maquinaria agrícola» o cualquier cosa con sus propias palabras y pulse Intro. La búsqueda con IA encuentra documentos por su significado, aunque no contengan esas palabras.
com.company.docai.view.tour/searchByMeaning.fieldText=Escriba «maquinaria agrícola» o cualquier cosa con sus propias palabras y pulse Intro. La búsqueda con IA encuentra documentos por su significado, aunque no contengan esas palabras.
com.company.docai.view.tour/leaseCard.text=Este contrato de arrendamiento tiene tres versiones, y sus comentarios muestran cómo se negoció la penalización.
com.company.docai.view.tour/leaseAssistant.text=Abra la pestaña Asistente de IA de esta ficha y pregunte qué se acordó. La IA responde a partir de este documento.
com.company.docai.view.tour/assistantMenu.text=Asistente de IA, en el menú, es un chat sobre todos sus documentos: ábralo.
com.company.docai.view.tour/assistantQuestion.text=Pregunte qué facturas vencen este mes.
com.company.docai.view.tour/repository.text=Este es el repositorio: el árbol de carpetas a la izquierda y los documentos de la carpeta en la tabla. Vista previa muestra el archivo seleccionado a la derecha.
com.company.docai.view.tour/upload.text=Arrastre esta factura a la tabla o haga clic en Subirla: se convertirá en un documento de esta carpeta.
com.company.docai.view.tour/finale.text=Ya ha visto las funciones principales, y hay más: el acceso a las carpetas, los favoritos, la papelera y el debate de varios documentos con la IA. Puede repetir el recorrido desde el menú de usuario.
com.company.docai.view.tour/finale.noAiText=Ya ha visto las funciones principales, y hay más: el acceso a las carpetas, los favoritos y la papelera. Puede repetir el recorrido desde el menú de usuario.
