io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScript=Script Groovy de carga de opciones
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderGroovyScriptHelp=<div>Permite cargar las opciones del atributo dinámico mediante un script Groovy.\
  <br/>El script debe devolver una lista de opciones. La entidad con atributos dinámicos está disponible \
  en el script mediante la variable <code>entity</code>. Tenga en cuenta que la variable <code>entity</code> puede ser <code>null</code> si se usa en \
  un filtro con una lista desplegable.\
  <br/>\
  <br/>Por ejemplo:\
  <br/><code>return ['code_1', 'code_2', (entity ? entity.code : 'code_0')]</code></div>
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScript=Script SQL de carga de opciones
io.jmix.dynattrflowui.view.categoryattr/optionsLoaderSqlScriptHelp=<div>Permite cargar las opciones del atributo dinámico mediante un script SQL.\
  <br/>El script debe devolver una lista de opciones.\
  <br/>Los valores de los atributos dinámicos están disponibles en el script mediante la variable <code>entity</code>. Tenga en cuenta que la variable <code>entity</code> \
  no estará definida en un filtro con una lista desplegable.\
  <br/>\
  <br/>Por ejemplo:\
  <br/><code>select street from db_Address e where e.strName = ${entity.+&lt;dynamicAttrCode&gt;}</code>\
  <br/>donde &lt;dynamicAttrCode&gt; es el código del atributo dinámico correspondiente</div>
io.jmix.dynattrflowui.view.categoryattr/joinClause=Cláusula join
io.jmix.dynattrflowui.view.categoryattr/joinClauseHelp=<div>El valor de este campo se añade a la cláusula "from" de la consulta. Debe empezar por una coma, "join" o "left join".\
  <br/>Los valores de los atributos dinámicos están disponibles en el script mediante la variable <code>entity</code>:\
  <br/>${entity.+&lt;dynamicAttrCode&gt;}, donde &lt;dynamicAttrCode&gt; es el código del atributo dinámico correspondiente. \
  <br/>Tenga en cuenta que la variable <code>entity</code> no estará definida en un filtro con una lista desplegable.\
  <br/>El marcador {E} debe usarse como alias de la entidad que se extrae. Al ejecutar la consulta, se sustituirá por el alias real indicado en la consulta.\
  <br/>\
  <br/>Por ejemplo:\
  <br/><code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/joinHelperText=<div>El valor de este campo se añade a la cláusula "from" de la consulta. \
  Debe empezar por una coma, "join" o "left join". Por ejemplo: <code>join {E}.seller s</code></div>
io.jmix.dynattrflowui.view.categoryattr/whereClause=Cláusula where
io.jmix.dynattrflowui.view.categoryattr/whereClauseHelp=<div>El valor de este campo se añade a la cláusula "where" de la consulta con la condición "and". No hace falta escribir la palabra "where", ya que se añade automáticamente.\
  <br/>El marcador {E} debe usarse como alias de la entidad que se extrae. Al ejecutar la consulta, se sustituirá por el alias real indicado en la consulta.\
  <br/>Los valores de los atributos dinámicos están disponibles en el script mediante la variable <code>entity</code>. Tenga en cuenta que la variable <code>entity</code> \
  no estará definida en un filtro con una lista desplegable.\
  <br/>\
  <br/>Por ejemplo:\
  <br/><code>{E}.salary > ${entity.+&lt;dynamicAttrCode&gt;} and {E}.department = 'abc'</code>\
  <br/>donde &lt;dynamicAttrCode&gt; es el código del atributo dinámico correspondiente</div>
io.jmix.dynattrflowui.view.categoryattr/validationScript=Validación personalizada
io.jmix.dynattrflowui.view.categoryattr/validationScriptHelp=<div>Permite aplicar un script Groovy al parámetro antes de guardarlo.\
  <br/>Si la validación falla, el script Groovy debe devolver un mensaje de error. En caso contrario, \
  el script no debe devolver ningún valor o debe devolver <code>null</code>. \
  <br/>El valor está disponible en el script mediante la variable <code>value</code>. \
  El mensaje de error se trata como una plantilla \
  y se puede usar la clave '${value}' para dar formato a la salida.\
  <br/>\
  <br/>Por ejemplo:\
  <br/><code>if (!value.startsWith("correctValue")) return "the value '\\${value}' is incorrect"</code></div>
io.jmix.dynattrflowui.view.categoryattr/recalculationScript=Script de recálculo
io.jmix.dynattrflowui.view.categoryattr/recalculationScriptHelp=<div>Script Groovy que se usa para recalcular el valor de este parámetro.\
  <br/> Al script se le pasan las siguientes variables: \
  <br/>\
  <br/><code>entity</code>: la entidad que se está editando \
  <br/>\
  <br/><code>dynamicAttributes</code>: un mapa cuya clave es el código del atributo y cuyo valor es el valor del atributo dinámico \
  <br/>\
  <br/>Ejemplo de script de recálculo con el mapa dynamicAttributes: \
  <br/>\
  <br/><code>if (dynamicAttributes['PassengerNumberOfSeats'] > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>Ejemplo de script de recálculo con la clase EntityValues: \
  <br/>\
  <br/><code>import io.jmix.core.entity.EntityValues;\
  <br/>\
  <br/>if(EntityValues.getValue(entity,"+PassengerNumberofseats") > 9) return 'Bus' else return 'Passenger'</code> \
  <br/>\
  <br/>El script se ejecuta cada vez que cambia el valor de uno de los atributos de la lista «Depende de los atributos».</div>
