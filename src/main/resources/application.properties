server.servlet.context-path=/dms

spring.profiles.active=${DMS_ACTIVE_PROFILE:local}

main.datasource.url=${DMS_DB_URL:jdbc:hsqldb:file:.jmix/hsqldb/dms}
main.datasource.username=${DMS_DB_USERNAME:sa}
main.datasource.password=${DMS_DB_PASSWORD:}

main.liquibase.change-log=com/company/dms/liquibase/changelog.xml

jmix.localfs.storage-dir=${DMS_FILES_DIR:.jmix/work/filestorage}
dms.files.max-file-size=20MB

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.default-view-id=RepositoryView
jmix.ui.menu-config=com/company/dms/menu.xml
jmix.ui.composite-menu=true
jmix.ui.component.grid-context-menu-show-action-icons=true

jmix.core.available-locales=en,ru

jmix.search.server.url=${DMS_SEARCH_URL:http://localhost:19200}
jmix.search.search-index-name-prefix=dms_
jmix.search.enqueue-index-all-on-startup-index-recreation-enabled=false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn
