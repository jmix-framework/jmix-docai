server.servlet.context-path=/docai

spring.profiles.active=${DOCAI_ACTIVE_PROFILE:local}

main.datasource.url=${DOCAI_DB_URL:jdbc:hsqldb:file:.jmix/hsqldb/docai}
main.datasource.username=${DOCAI_DB_USERNAME:sa}
main.datasource.password=${DOCAI_DB_PASSWORD:}

main.liquibase.change-log=com/company/docai/liquibase/changelog.xml

jmix.localfs.storage-dir=${DOCAI_FILES_DIR:.jmix/work/filestorage}
docai.files.max-file-size=20MB

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.default-view-id=RepositoryView
jmix.ui.menu-config=com/company/docai/menu.xml
jmix.ui.composite-menu=true
jmix.ui.component.grid-context-menu-show-action-icons=true

jmix.core.available-locales=en,ru

jmix.search.server.url=${DOCAI_SEARCH_URL:http://localhost:19200}
jmix.search.search-index-name-prefix=docai_
jmix.search.enqueue-index-all-on-startup-index-recreation-enabled=false

# the AI features hide themselves while the key is empty
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${DOCAI_AI_MODEL:gpt-5.6-luna}
spring.ai.openai.chat.reasoning-effort=${DOCAI_AI_REASONING_EFFORT:none}
spring.ai.openai.chat.temperature=${DOCAI_AI_TEMPERATURE:0}
# a call of the model ends before the card stops waiting for it (FillWithAiAction.TIMEOUT_SECONDS)
spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=1
docai.ai.max-text-length=12000
# how many documents a discussion with the AI takes at most
docai.ai.discussion.max-documents=10

spring.ai.openai.embedding.model=${DOCAI_AI_EMBEDDING_MODEL:text-embedding-3-large}
# the size of the vectors: the model gives vectors of it, and the index of fragments is built anew when it changes
docai.semantic.dimensions=${DOCAI_AI_EMBEDDING_DIMENSIONS:3072}
spring.ai.openai.embedding.dimensions=${docai.semantic.dimensions}
# how much of the text of a document the search by meaning reads
docai.semantic.max-text-length=40000

# the demo set an empty database gets at the start: en, ru or none; the local profile chooses one
docai.demo-data=none

# the assistant in the menu sees the documents, the folders, the document types and the tags only: the include list
# adds to the add-on's default, so the package of the application is shut and the four are named
jmix.aitools.dataload.exclude-packages=io.jmix,com.company.docai
jmix.aitools.dataload.include-entities=Document,Folder,dynat_Category,Tag

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

# the splitter of the semantic search logs every document it cuts
logging.level.org.springframework.ai.transformer.splitter=warn
